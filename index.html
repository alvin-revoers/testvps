<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoVNC</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b12;color:#fff;font-family:Arial,sans-serif}.card{width:min(390px,92vw);padding:30px;border:1px solid #273044;border-radius:18px;background:#111725;box-shadow:0 20px 70px #0008;text-align:center}.lock{font-size:42px}.sub{color:#9aa6ba;margin-bottom:24px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #39445b;background:#090d16;color:#fff;font-size:20px;text-align:center;letter-spacing:6px;outline:none}button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:#2388ff;color:white;font-weight:700;font-size:16px;cursor:pointer}#msg{min-height:22px;margin-top:12px;color:#ff7474}
</style>
</head>
<body>
<div class="card"><div class="lock">🔐</div><h2>VNC Access</h2><div class="sub">Masukkan PIN untuk melanjutkan</div><form id="f"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="32" autofocus><button>Masuk</button><div id="msg"></div></form></div>
<script>
const f=document.getElementById('f'),pin=document.getElementById('pin'),msg=document.getElementById('msg');
f.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value})});if(r.ok)location.href='/vnc.html';else{msg.textContent='PIN salah';pin.select()}}catch(e){msg.textContent='Gagal terhubung'}});
fetch('/api/status').then(r=>r.json()).then(x=>{if(x.authenticated)location.href='/vnc.html'}).catch(()=>{});
</script>
</body></html>
